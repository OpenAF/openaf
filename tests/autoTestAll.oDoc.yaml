include:
   - oJobTest.yaml

jobs:
   # OPENAF oDoc tests
   # --------------------
   - name: oDoc::Test access to oDoc
     to  : oJob Test
     args:
       func: |
          log("Online/Offline oDoc");
          var od1 = searchHelp("index")[0];
          var id1 = od1.id;
          
          log("Just offline oDoc");
          setOfflineHelp(true);
          var od2 = searchHelp("index")[0];
          var id2 = od2.id;

          ow.test.assert(id1, "index", "Online or offline oDoc missing index.");
          ow.test.assert(id2, "index", "Offline oDoc missing index.");

   - name: oDoc::MemoryAndSearch
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testMemoryAndSearch;

   - name: oDoc::StoragePaths
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testStoragePaths;

   - name: oDoc::Offline
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testOffline;

   - name: oDoc::Generator
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testGenerator;

   - name: oDoc::WebAppend
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testWebAppend;

   - name: oDoc::MarkdownSourceEntries
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testMarkdownSourceEntries;

   - name: oDoc::WebFallback
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testWebFallback;

   - name: oDoc::SearchHelp
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testSearchHelp;

   - name: oDoc::ResourceCleanup
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testResourceCleanup;

   - name: oDoc::ConsoleDisplay
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testConsoleDisplay;

   - name: oDoc::BrowserHandlers
     to: oJob Test
     exec: args.func = require("autoTestAll.oDoc.js").testBrowserHandlers;

