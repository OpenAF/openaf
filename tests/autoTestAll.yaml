include:
- oJobTest.yaml

ojob:
   sequential: false
   async     : true
   opacks    :
   - oJob-common
   channels  :
     expose : true
     port   : 17878
     log    : true
     list:
     - oJob::log
     - oJob::jobs
     - oJob::todo
     - oJob::oJob
     - __owTest::tests

jobs:
   # RUN TESTS
   # ---------
   - name: Initialize Results
     exec: |
       global.__testRunId = genUUID();
       io.writeFileJSON("autoTestAll.results.json", {runId:global.__testRunId, complete:false});

   - name    : Run Tests
     deps: [Initialize Results]
     type    : jobs
     typeArgs:
       file: autoTestAll.allJobs.yaml

   # FINAL TEST RESULTS
   # ------------------
   - name: Results
     from: oJob Test Results
     deps:
       - Run Tests
     args:
       quiet: true
     exec: |
       args.results.asserts = ow.test.getCountAssert()
       tprint("Tests PASSED : {{pass}}/{{count}}", args.results);
       tprint("Tests FAILED : {{fail}}/{{count}}", args.results);
       tprint("Count asserts: {{asserts}}", args.results)
       if (args.results.fail > 0) printErr("There are failed tests");

       // Write a simple json result file
       io.writeFile("autoTestAll.results.json", {
         runId: global.__testRunId,
         complete: false,
         pass: args.results.pass,
         fail: args.results.fail,
         count: args.results.count,
         asserts: args.results.asserts
       })

   - name: JUnit results
     to  : oJob Generate JUnit XML
     deps:
       - Run Tests
     exec: >
       args.suitesName  = "Automatic OpenAF build test";
       args.resultsFile = "autoTestAllResults.xml";
       args.suitesId    = af.getVersion();
       io.writeFileString("autoTestAll.md", ow.test.toMarkdown());

   - name: End
     deps:
       - Run Tests
       - Results
       - JUnit results
     exec: >
       sleep(1000);
       var result = io.readFileJSON("autoTestAll.results.json");
       result.complete = ow.test.getResults().complete;
       result.infrastructureErrors = ow.test.getResults().infrastructureErrors;
       io.writeFileJSON("autoTestAll.results.json", result);
       exit(result.complete && result.fail === 0 && result.count > 0 && result.infrastructureErrors.length === 0 ? 0 : 1);

todo:
