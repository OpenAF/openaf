include:
- autoTestAll.common.yaml

ojob:
   sequential: false
   async     : true
   opacks    :
   - oJob-common
   channels  :
     expose : true
     port   : 17878
     log    : true
     list:
     - oJob::log
     - oJob::jobs
     - oJob::todo
     - oJob::oJob
     - __owTest::tests

jobs:
   # RUN TESTS
   # ---------
   - name: Initialize Results
     exec: |
       ow.loadTest()
       ow.test.reset()
       global.__testRunId = genUUID()
       io.writeFileJSON("autoTestAll.results.json", {runId:global.__testRunId, complete:false});

   - name    : Run Tests
     deps: [Initialize Results]
     type    : jobs
     typeArgs:
       file: autoTestAll.allJobs.yaml

   # FINAL TEST RESULTS
   # ------------------
   - name: Results
     deps:
       - Run Tests
     exec: |
       var jobErrors = ow.oJob.getLogCh().getAll().filter(function(entry) {
         return entry.error && (entry.ojobId === ow.oJob.getID() + "autoTestAll.allJobs.yaml" || entry.name === "Run Tests")
       }).map(function(entry) {
         return { name: "OJobError", phase: "scheduler", message: "Job failed: " + entry.name }
       })
       var result = require("autoTestAll.reporting.js").summarize(ow.test.getResults(), global.__testRunId, jobErrors)
       tprint("Tests PASSED : {{pass}}/{{count}}", result)
       tprint("Tests FAILED : {{fail}}/{{count}}", result)
       tprint("Tests SKIPPED: {{skip}}/{{count}}", result)
       tprint("Count asserts: {{asserts}}", result)
       if (result.exitCode !== 0) printErr("Test run failed or is incomplete")

       // Publish complete:true only after every report has been written.
       io.writeFileString("autoTestAllResults.xml", ow.test.report.junit(result, af.getVersion(), "Automatic OpenAF build test"))
       io.writeFileString("autoTestAll.md", ow.test.report.markdown(result))
       io.writeFileString("autoTestAll.results.json", ow.test.report.json(result))

   - name: End
     deps:
       - Results
     exec: |
       var result = io.readFileJSON("autoTestAll.results.json")
       exit(result.runId === global.__testRunId && result.complete ? result.exitCode : 2)

todo:
   - Initialize Results
   - Run Tests
   - Results
   - End
