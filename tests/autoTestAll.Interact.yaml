include:
- autoTestAll.common.yaml
- ../ojob.yaml

jobs:

# Interact::Init
- name: Interact::Init
  exec: |
    ow.loadScreen()
    // Fall back to checkout source when exercising an older installed runtime.
    if (typeof ow.screen.interact != "function") {
      load("../js/owrap.screen.js")
      ow.screen = new OpenWrap.screen()
      ow.loadDesktop()
      load("../js/owrap.desktop.js")
      loadCompiledLib("owrap_desktop_ui_js")
      load("../js/owrap.desktop.ui.js")
    }
    args.tests = require("autoTestAll.Interact.js")

# Interact fixture handler
- name: Interact fixture handler
  exec: |
    sleep(args.delay || 0, true)

# Interact fixture failure
- name: Interact fixture failure
  exec: throw "fixture failure"

# Interact fixture reducer
- name: Interact fixture reducer
  exec: |
    if (args.state.stopOnInit) args.close = true
    if (args.state.failReducer) throw "reducer failure"
    if (args.error) { args.state.failure = args.error; args.close = true }
    if (args.result && args.result.close) args.close = true
    if (args.result && args.result.values) args.state.values = args.result.values
    if (args.result && args.result.label) args.state.completed.push(args.result.label)
    if (args.result && args.result.tick) args.state.ticks++
    if (args.state.completed.length == 2 || args.state.ticks == 2) args.close = true

# Interact::Concurrent results
- name: Interact::Concurrent results
  from: Interact::Init
  to: OpenAF Test
  exec: args.func = args.tests.testConcurrentResults

# Interact::Timer
- name: Interact::Timer
  from: Interact::Init
  to: OpenAF Test
  exec: args.func = args.tests.testTimer

# Interact::Close drain
- name: Interact::Close drain
  from: Interact::Init
  to: OpenAF Test
  exec: args.func = args.tests.testCloseDrain

# Interact::Validation
- name: Interact::Validation
  from: Interact::Init
  to: OpenAF Test
  exec: args.func = args.tests.testValidation

# Interact::Handler failure
- name: Interact::Handler failure
  from: Interact::Init
  to: OpenAF Test
  exec: args.func = args.tests.testHandlerFailure

# Interact::Reducer failure
- name: Interact::Reducer failure
  from: Interact::Init
  to: OpenAF Test
  exec: args.func = args.tests.testReducerFailure

# Interact::TUI
- name: Interact::TUI
  from: Interact::Init
  to: OpenAF Test
  exec: args.func = args.tests.testTUI

# Interact::Capacity
- name: Interact::Capacity
  from: Interact::Init
  to: OpenAF Test
  exec: args.func = args.tests.testCapacity

# Interact::Embedded shortcut
- name: Interact::Embedded shortcut
  from: Interact::Init
  to: OpenAF Test
  exec: args.func = args.tests.testEmbedded

# Interact::Console controls
- name: Interact::Console controls
  from: Interact::Init
  to: OpenAF Test
  exec: args.func = args.tests.testConsoleControls

