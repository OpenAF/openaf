include:
  - oJobTest.yaml

jobs:
  - name: StreamConversions::Init
    exec: args.tests = require("autoTestAll.StreamConversions.js");

  - name: StreamConversions::Round trips and compatibility
    from: StreamConversions::Init
    to: oJob Test
    exec: args.func = args.tests.testRoundTrips;

  - name: StreamConversions::Ownership and finalization
    from: StreamConversions::Init
    to: oJob Test
    exec: args.func = args.tests.testOwnership;

  - name: StreamConversions::Failures and invalid arguments
    from: StreamConversions::Init
    to: oJob Test
    exec: args.func = args.tests.testFailures;

  - name: StreamConversions::Finalization and cleanup errors
    from: StreamConversions::Init
    to: oJob Test
    exec: args.func = args.tests.testFinalizationFailures;

