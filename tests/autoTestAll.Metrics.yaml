include:
- oJobTest.yaml

jobs:
- name: Metrics::Init
  exec: args.tests = require("autoTestAll.Metrics.js");

- name: Metrics::Quoted labels
  from: Metrics::Init
  to: oJob Test
  exec: args.func = args.tests.testOpenMetricsLabels;

- name: Metrics::Compatibility
  from: Metrics::Init
  to: oJob Test
  exec: args.func = args.tests.testOpenMetricsCompatibility;

- name: Metrics::Invalid labels
  from: Metrics::Init
  to: oJob Test
  exec: args.func = args.tests.testOpenMetricsInvalidLabels;

