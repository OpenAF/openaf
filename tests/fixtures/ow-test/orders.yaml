ojob:
  async: false
  logToConsole: false

jobs:

# Inventory
- name: Inventory
  exec: args.available = false

# ProcessOrder
- name: ProcessOrder
  from: Inventory
  exec: |
    args.status = args.available ? 'CONFIRMED' : 'REJECTED'

# Broken
- name: Broken
  exec: throw new Error('order failure')

