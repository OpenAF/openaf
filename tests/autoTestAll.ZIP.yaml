include:
   - autoTestAll.common.yaml

jobs:
   - name: ZIP::Archive extraction quotas
     from: ZIP::Init
     to: OpenAF Test
     exec: args.func = args.tests.testArchiveExtractionLimits

   # ZIP tests
   # --------------
   - name: ZIP::Init
     exec: |
       args.tests = require("autoTestAll.ZIP.js");

   - name: ZIP::ZIP basic functionality
     from: ZIP::Init
     to  : OpenAF Test
     exec: args.func = args.tests.testZIP;

   - name: ZIP::ZIP streaming functionality 
     from: ZIP::Init
     to  : OpenAF Test
     exec: args.func = args.tests.testZIPStream;

   - name: ZIP::Read ownership and missing entries
     from: ZIP::Init
     to  : OpenAF Test
     exec: args.func = args.tests.testZIPReadOwnership

   - name: ZIP::Metadata listing and integrity contracts
     from: ZIP::Init
     to: OpenAF Test
     exec: args.func = args.tests.testZIPMetadataListing

