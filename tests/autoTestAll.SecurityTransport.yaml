include:
  - oJobTest.yaml

jobs:
  - name: SecurityTransport::Init
    exec: args.tests = require("autoTestAll.SecurityTransport.js");

  - name: SecurityTransport::SMTP STARTTLS requirement
    from: SecurityTransport::Init
    to  : oJob Test
    exec: args.func = args.tests.testEmailTLSRequirement;

  - name: SecurityTransport::FTPS trust configuration
    from: SecurityTransport::Init
    to  : oJob Test
    exec: args.func = args.tests.testFTPSTrustConfiguration;

