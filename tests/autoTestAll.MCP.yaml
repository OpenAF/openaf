include:
   - oJobTest.yaml

jobs:
   - name: MCP::Init
     exec: |
       args.tests = require("autoTestAll.MCP.js");

   - name: MCP::OAuth discovery with client credentials
     from: MCP::Init
     to  : oJob Test
     exec: args.func = args.tests.testOAuthDiscoveryClientCredentials;

   - name: MCP::OAuth authorization URL includes resource and PKCE
     from: MCP::Init
     to  : oJob Test
     exec: args.func = args.tests.testOAuthAuthorizationCodeBuildsAuthorizationURL;

   - name: MCP::OAuth authorization code token exchange includes resource and verifier
     from: MCP::Init
     to  : oJob Test
     exec: args.func = args.tests.testOAuthAuthorizationCodeTokenExchange;

   - name: MCP::Remote clients close request HTTP clients
     from: MCP::Init
     to  : oJob Test
     exec: args.func = args.tests.testRemoteMCPClosesRequestHTTPClients;

   - name: MCP::oJob tplDesc renders all tool metadata strings
     from: MCP::Init
     to  : oJob Test
     exec: args.func = args.tests.testOJobTplDescRendersAllToolMetadataStrings;

   - name: MCP::auto client negotiates modern era with dual-era server
     from: MCP::Init
     to  : oJob Test
     exec: args.func = args.tests.testMCPAutoClientNegotiatesModernEraWithDualEraServer;

   - name: MCP::auto client falls back to legacy server
     from: MCP::Init
     to  : oJob Test
     exec: args.func = args.tests.testMCPAutoClientFallsBackToLegacyServer;

   - name: MCP::legacy client unaffected by dual-era server
     from: MCP::Init
     to  : oJob Test
     exec: args.func = args.tests.testMCPLegacyClientUnaffectedByDualEraServer;

   - name: MCP::modern server rejects unsupported protocol version
     from: MCP::Init
     to  : oJob Test
     exec: args.func = args.tests.testMCPModernServerRejectsUnsupportedProtocolVersion;

   - name: MCP::server discover is probeable without client capabilities
     from: MCP::Init
     to  : oJob Test
     exec: args.func = args.tests.testMCPServerDiscoverIsProbeableWithoutClientCapabilities;

todo:
