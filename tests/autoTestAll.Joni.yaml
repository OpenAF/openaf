include:
  - oJobTest.yaml
jobs:
  - name: Joni::Init
    exec: args.tests = require("autoTestAll.Joni.js");
  - name: Joni::Matching
    from: Joni::Init
    to: oJob Test
    exec: args.func = args.tests.testJoniMatching;
  - name: Joni::Unicode
    from: Joni::Init
    to: oJob Test
    exec: args.func = args.tests.testJoniUnicode;
  - name: Joni::Replacement
    from: Joni::Init
    to: oJob Test
    exec: args.func = args.tests.testJoniReplacement;
  - name: Joni::Split
    from: Joni::Init
    to: oJob Test
    exec: args.func = args.tests.testJoniSplit;
  - name: Joni::Errors
    from: Joni::Init
    to: oJob Test
    exec: args.func = args.tests.testJoniErrors;
  - name: Joni::Parallel
    from: Joni::Init
    to: oJob Test
    exec: args.func = args.tests.testJoniParallel;
