include:
   - oJobTest.yaml

jobs:
   # CHANNELS tests
   # --------------
   - name: Channels::Init
     exec: |
       args.tests = require("autoTestAll.Channels.js", true);
       args.tests.setChType(args.chType);

   - name: Channels::Creating a channel
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testCreateChannel; 

   - name: Channels::Setting data into a channel
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testSettingData;
    
   - name: Channels::Unsetting data into a channel
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testUnsettingData;

   - name: Channels::Remote channel access auditing
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testAuditLog;
 
   - name: Channels::Destroy a channel
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testDestroyChannel;

   - name: Channels::Test housekeeping
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testHousekeeping;

   - name: Channels::Test Elastic Index
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testElasticIndex;

   - name: Channels::Subscribers test
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testChannelSubscribers;

   - name: Channels::Keep history util
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testKeepHistory;

   # Big
   # ---
   - name: Channels::Test channel (big)
     to  :
       - Channels::Creating a channel
       - Channels::Setting data into a channel
       - Channels::Unsetting data into a channel
       - Channels::Destroy a channel 
       - Channels::Test housekeeping
     args:
       chType: big

   # Simple
   # ------
   - name: Channels::Test channel (simple)
     to  :
       - Channels::Creating a channel
       - Channels::Setting data into a channel
       - Channels::Unsetting data into a channel
       - Channels::Destroy a channel 
       - Channels::Test housekeeping
     args:
       chType: simple

   # File
   # ----
   - name: Channels::Test channel (file)
     to  :
       - Channels::Creating a channel
       - Channels::Setting data into a channel
       - Channels::Unsetting data into a channel
       - Channels::Destroy a channel 
       - Channels::Test housekeeping
     args:
       chType: file

   # Cache
   # -----
   - name: Channels::Test channel (cache)
     to  :
       - Channels::Creating a channel
       #- Channels::Setting data into a channel
       #- Channels::Unsetting data into a channel
       - Channels::Destroy a channel 
       - Channels::Test housekeeping
     args:
       chType: cache

   # Mvs
   # ---
   - name: Channels::Test channel (mvs)
     to  :
       - Channels::Creating a channel
       - Channels::Setting data into a channel
       - Channels::Unsetting data into a channel
       - Channels::Destroy a channel 
       - Channels::Test housekeeping
     args:
       chType: mvs
      

   - name: Channels::Test MVS Utils
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testMVSUtils;

   - name: Channels::MVS multifile basic
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testMVSMultifile;

   - name: Channels::MVS multifile manifest mismatch
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testMVSMultifileManifestMismatch;

   - name: Channels::MVS multifile pagination
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testMVSMultifilePagination;

   - name: Channels::MVS multifile sharing
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testMVSMultifileSharing;

   - name: Channels::MVS multifile reshard
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testMVSMultifileReshard;

   - name: Channels::MVS shift and pop
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testMVSShiftPop;

   - name: Channels::Graph channel
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testGraphChannel;

   - name: Channels::Graph channel store
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testGraphChannelStore;

   - name: Channels::TimeSeries channel
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testTimeSeriesChannel;

   - name: Channels::TimeSeries channel store
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testTimeSeriesChannelStore;

   - name: Channels::TimeSeries integrations
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testTimeSeriesIntegrations;

   - name: Channels::TimeSeries concurrency
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testTimeSeriesConcurrency;

   - name: Channels::Test channel (all)
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testAll

   - name: Channels::File multifile read and delete
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testFileMultifileReadDelete;

   - name: Channels::File iteration keys
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testFileIterationKeys;

   - name: Channels::File multifile configured key
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testFileMultifileConfiguredKey;

   - name: Channels::Proxy bulk delete
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testProxyBulkDelete;

   - name: Channels::Proxy queue
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testProxyQueue;

   - name: Channels::Shift error propagation
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testShiftError;

   - name: Channels::Concurrent lifecycle
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testConcurrentLifecycle;

   - name: Channels::Lifecycle idempotency
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testLifecycleIdempotency;

   - name: Channels::Lifecycle failure and reentry
     from: Channels::Init
     to  : oJob Test
     exec: args.func = args.tests.testLifecycleFailureAndReentry;

