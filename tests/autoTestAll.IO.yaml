include:
   - oJobTest.yaml

jobs:
   # IO tests
   # --------------
   - name: IO::Init
     exec: |
       args.tests = require("autoTestAll.IO.js");

   - name: IO::IO Test copy streams
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testIOCopyStream;

   - name: IO::IO Test JSON
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testIOJSON;
 
   - name: IO::IO Test JSON array stream
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testJSONArray;

   - name: IO::IO Test Stream JSON
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testIOStreamJSON

   - name: IO::IO Test read/writeFileStream
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testIOStream;

   - name: IO::IO Test read/writeFileStreamBytes
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testIOStreamBytes;

   - name: IO::IO Test read/writeFileStream NIO
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testIOStreamNIO;

   - name: IO::IO Test read/writeFileStreamBytes NIO
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testIOStreamBytesNIO;

   - name: IO::IO Test Gzip Native to Byte array
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testGzipNativeToByte;

   - name: IO::IO Test binary file detection
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testBinaryFileDetection;

   - name: IO::IO Test copy/move/delete file
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testCopyMoveDeleteFile;

   - name: IO::IO Test TAR functionality
     from: IO::Init
     to  : oJob Test
     exec: args.func = args.tests.testTAR;

   - name: IO::JSON metadata traversal
     from: IO::Init
     to: oJob Test
     exec: args.func = args.tests.testJSONMetadata;

   - name: IO::JSON extraction
     from: IO::Init
     to: oJob Test
     exec: args.func = args.tests.testJSONExtraction;

   - name: IO::ZIP extraction containment
     from: IO::Init
     to: oJob Test
     exec: args.func = args.tests.testUnzipContainment;

   - name: IO::Stream write boundaries
     from: IO::Init
     to: oJob Test
     exec: args.func = args.tests.testStreamWriteBoundaries;

   - name: IO::Stream decoding and ownership
     from: IO::Init
     to: oJob Test
     exec: args.func = args.tests.testStreamDecodingAndOwnership;

   - name: IO::Stream line boundaries
     from: IO::Init
     to: oJob Test
     exec: args.func = args.tests.testStreamLineBoundaries;

   - name: IO::XML skip lines
     from: IO::Init
     to: oJob Test
     exec: args.func = args.tests.testXMLSkipLines;

   - name: IO::Gzip initialization cleanup
     from: IO::Init
     to: oJob Test
     exec: args.func = args.tests.testGzipInitializationCleanup;

