include:
  - oJobTest.yaml
jobs:
  - name: StreamConsumers::Init
    exec: args.tests = require("autoTestAll.StreamConsumers.js");
  - name: StreamConsumers::Text codecs and fallbacks
    from: StreamConsumers::Init
    to: oJob Test
    exec: args.func = args.tests.testTextCodecs;
  - name: StreamConsumers::Images
    from: StreamConsumers::Init
    to: oJob Test
    exec: args.func = args.tests.testImageConsumers;
  - name: StreamConsumers::Generic output
    from: StreamConsumers::Init
    to: oJob Test
    exec: args.func = args.tests.testGenericOutput;
  - name: StreamConsumers::HTTP templates
    from: StreamConsumers::Init
    to: oJob Test
    exec: args.func = args.tests.testHTTPTemplates;
