include:
   - oJobTest.yaml

jobs:
   # DB tests
   # --------------
   - name: DB::Init
     exec: args.tests = require("autoTestAll.DB.js");

   - name: DB::Simple DB in memory
     from: DB::Init
     to  : oJob Test
     exec: args.func = args.tests.testDBInMemory;

   - name: DB::DB type conversion to JS
     from: DB::Init
     to  : oJob Test
     exec: args.func = args.tests.testDBTypeConversion;     

   - name: DB::Prepared statement binds and cache
     from: DB::Init
     to  : oJob Test
     exec: args.func = args.tests.testDBPreparedStatements;

   - name: DB::Statement error cleanup
     from: DB::Init
     to  : oJob Test
     exec: args.func = args.tests.testDBStatementCleanup;

