help:
  text: Read a JSON array from an HTTP endpoint.
  expects:
  - name: url
    desc: URL returning a JSON array
    mandatory: true
ojob:
  logToConsole: false
  catch: |
    printErr("http-json: " + exception);
    exit(1);
jobs:
- name: Fetch
  check:
    in:
      url: isString
  exec: |
    var result = $rest({ throwExceptions: true, connectionTimeout: 5000 }).get(args.url);
    print(stringify(_$(result, "response").isArray().$_(), __, ""));
