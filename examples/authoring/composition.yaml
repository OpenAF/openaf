ojob:
  sequential: true
  shareArgs: true
  logToConsole: false

jobs:

# Prepare
- name: Prepare
  exec: |
    args.value = 21
    print("prepared")

# Double
- name: Double
  exec: |
    args.value *= 2

# Calculate
- name: Calculate
  deps: [Prepare]
  from: [Double]
  to: [Display]
  check:
    in:
      value: isNumber
    out:
      result: isNumber
  exec: |
    args.result = args.value

# Display
- name: Display
  exec: |
    print(args.result)

