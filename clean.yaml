# Run from the repository root: ojob clean.yaml
# Preview: ojob clean.yaml dryrun=true
# Also clean build directories: ojob clean.yaml jsmin=true jslib=true bin=true
help:
  text: Clean discardable test outputs, optionally including build directories.
  expects:
  - name: path
    desc: Repository root (defaults to the current directory).
    example: .
  - name: dryrun
    desc: List matching outputs without deleting them (defaults to false).
    example: true
  - name: jsmin
    desc: Remove jsmin and buildSHA.json (defaults to false).
    example: true
  - name: jslib
    desc: Remove jslib and buildSHA.json (defaults to false).
    example: true
  - name: bin
    desc: Remove bin (defaults to false).
    example: true

ojob:
  sequential: true
  logToConsole: false
  catch: throw exception;

todo:
- Clean outputs

jobs:
- name: Clean outputs
  exec: | #js
    var root = io.fileInfo(_$(args.path, "path").isString().default(".")).canonicalPath;
    ["tests", "js", "src", "build.yaml"].forEach(function(name) {
      if (!io.fileExists(root + "/" + name)) throw "Not an OpenAF repository root: " + root;
    });
    var enabled = function(name) {
      return _$(args[name], name).toBoolean().isBoolean().default(false);
    };
    var dryrun = enabled("dryrun");
    var jsmin = enabled("jsmin"), jslib = enabled("jslib"), bin = enabled("bin");
    // Explicit names keep test sources, fixtures and benchmark baselines intact.
    var outputs = [
      "autoTestAll.results.json", "autoTestAllResults.xml", "autoTestAll.md",
      "framework-results.json", ".openaf_precompiled",
      "results.svg", "asserts.svg", "languages-results.json", "data-file.json",
      "autoTestAll.test", "autoTestAll.txt", "autoTestAll.xml", "autoTestAll.xlsx",
      "autoTestAll.gz", "autoTestAll.jar", "autoTestAll.zip",
      "autoTestAll.csv", "autoTestAll1.csv", "autoTestAll.Cache.db", "autoTestAll.auth.db",
      "autoTestAll.xorNet.gz", "autoTestAll.ai.andNet.lstm.gz", "autoTestAll.ai.xorNet.liquid.gz",
      "autoTestAll.compile.tmp", "autoTest.ndjson", "__autoTest.js", "__autoNewTest.js",
      "dt.json.gz", "rt.json.gz", "C45.json.gz", "testMVS.db", "test.jks",
      "server.pid", "test_checkin.pid"
    ].map(function(name) { return "tests/" + name; });
    io.listFiles(root + "/tests").files.forEach(function(file) {
      // The DB test's day-of-year date format produces 14 or 15 digits.
      var dbOutput = /^\d{14,15}\.test(?:\.(?:mv\.db|trace\.db|lock\.db))?$/.test(file.filename)
      var mcpOutput = /^ojob_mcp_tpldesc_[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\.yaml$/i.test(file.filename)
      if (file.isFile && (dbOutput || mcpOutput)) {
        outputs.push("tests/" + file.filename);
      }
    });
    if (jsmin) outputs.push("jsmin");
    if (jslib) outputs.push("jslib");
    if (bin) outputs.push("bin");
    if (jsmin || jslib) outputs.push("buildSHA.json");
    outputs.forEach(function(name) {
      var target = root + "/" + name;
      if (!io.fileExists(target)) return;
      print((dryrun ? "Would remove " : "Removing ") + name);
      if (!dryrun && !io.rm(target)) throw "Could not remove " + target;
    });
    // Remove these leftover directories only when empty, without following links.
    var emptyDirectories = {}
    ;["tests/private/tmp", "tests/private"].forEach(function(name) {
      var target = root + "/" + name
      var directory = new java.io.File(target)
      if (!directory.isDirectory() || String(directory.getCanonicalPath()).replace(/\\/g, "/") !== target) return
      var children = directory.list()
      if (children === null) throw "Could not list " + target
      for (var i = 0; i < children.length; i++) {
        if (!emptyDirectories[name + "/" + children[i]]) return
      }
      print((dryrun ? "Would remove " : "Removing ") + name)
      // File.delete is nonrecursive and fails if new contents appeared meanwhile.
      if (!dryrun && !directory.delete()) throw "Could not remove empty directory " + target
      emptyDirectories[name] = true
    })
