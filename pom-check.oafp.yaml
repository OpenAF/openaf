# Usage      : oafp -f pom-check.oafp.yaml
# Description: Check for stable updates (ignoring alpha, beta, rc, milestones, snapshots, etc...) of maven dependencies in pom.xml
#
file: pom.xml
path: project.dependencies.dependency
out : json
pipe:
  in      : json
  out     : json
  sql     : | #sql
    SELECT * WHERE update = true OR onlineVersion LIKE 'error:%' ORDER BY groupId, artifactId
  oaf     : | #js
    ow.loadJava()
    ow.loadFormat()
    var m = new ow.java.maven()
    return pForEach(data, d => {
      try {
        // Use groupId + artifactId separately (artifactIds may contain dots, e.g. jakarta.xml.bind-api)
        d.onlineVersion = m.getLatestVersionGA(d.groupId, d.artifactId, true)
        d.update = isDef(d.onlineVersion) && ow.format.compareVersion(d.onlineVersion, d.version) > 0
      } catch(e) {
        d.onlineVersion = "error: " + String(e)
        d.update = false
      }
      return d
    })
  pipe    :
    out     : ctable
