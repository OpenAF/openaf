    desc: A base64 text format
    opts:
    - name: base64gzip=
      desc: If true, gzip before Base64 encoding or gunzip after Base64 decoding
  - name: out=bstable
    desc: A borderless Unicode table with separators between records and wrapping to the terminal width (for lists or maps)
  - name: out=btable
    desc: A borderless Unicode table without separators between records and with wrapping to the terminal width (for lists or maps)
  - name: out=btree
    desc: A tree-like format without ANSI colors, using plain-text branch characters
  - name: out=ch
    desc: An OpenAF channel format
    opts:
    - name: ch=
      desc: A JSON/SLON configuration string with type and options/url
    - name: chkey=
      desc: A comma delimited list of map keys to build a key from each array value
    - name: chunset=
      desc: If true the input data will be used to unset data on the output channel instead of set
  - name: out=chart
    desc: A line-chart style chart (useful together with 'loop')
    opts:
    - name: chart=
      desc: Required. Unit, one or more series, and optional axis/size flags, as described below.
    - name: chartcls=
      desc: Clear the screen before printing each chart update. Use this or the general loopcls=true option to redraw in place. Otherwise updates are printed one after another.
    - name: loop=
      desc: If defined will loop the processing by the number of seconds provided
  - name: out=cjson
    desc: A JSON forcely colored format
  - name: out=cmd
    desc: Executes a command for each input data entry
    opts:
    - name: outcmd=
      desc: The command to execute receiving, in pipeline, each input entry in json
    - name: outcmdjoin=
      desc: If true and if input is an array the entire array will be the input entry
    - name: outcmdseq=
      desc: If true and if input is an array the commands will be executed in sequence
    - name: outcmdnl=
      desc: If true each command execution output will be appended with a new-line
    - name: outcmdparam=
      desc: If true the input entry will be replaced on the 'outcmd' where '{}' is found
    - name: outcmdtmpl=
      desc: If true the input entry will be considered as an HandleBars' template
  - name: out=cslon
    desc: A SLON format forcely colored
  - name: out=csv
    desc: A CSV format (only for list outputs)
    opts:
    - name: inputcsv=
      desc: CSV input configuration as JSON/SLON
    - name: incsv=
      desc: Alias for inputcsv
    - name: csv=
      desc: If type=csv, the CSV options to use
  - name: out=ctable
    desc: A table-like forcely colored format (only for list outputs)
  - name: out=ctree
    desc: A tree-like forcely colored format
  - name: out=clkyaml
    desc: A Kubernetes YAML without new-lines colored format
  - name: out=ckyaml
    desc: A Kubernetes YAML colored format
  - name: out=cyaml
    desc: An YAML colored format
  - name: out=db
    desc: Output to a JDBC database
    opts:
    - name: dbjdbc=
      desc: The JDBC URL to access the input database
    - name: dbuser=
      desc: The JDBC access user
    - name: dbpass=
      desc: The JDBC access password
    - name: dbtimeout=
      desc: The JDBC access timeout
    - name: dblib=
      desc: Use a JDBC driver oPack generated by ojob.io/db/getDriver
    - name: dbtable=
      desc: The db table in which should be inserted ('data' by default)
    - name: dbnocreate=
      desc: If true no table creation command will be executed (if the table already exists set this to true)
    - name: dbicase=
      desc: If true table and field names will try to ignore case
    - name: dbbatchsize=
      desc: If defined it will changed the default batch data insert process
  - name: out=dsv
    desc: A delimiter-separated values format with configurable separator, quoting and headers (for lists or maps; see DSV output options)
    opts:
    - name: dsvsep=
      desc: The separator to use (default is ',')
    - name: dsvquote=
      desc: Replacement for double quotes inside serialized object/array cells (default is a backslash followed by a double quote). String cells and headers always use double quotes, with embedded quotes doubled.
    - name: dsvfields=
      desc: Comma separated output columns in the requested order. Defaults to the first row's keys for the whole table. Missing values are empty; additional keys in later rows are omitted. Does not override dsvheader=false.
    - name: dsvuseslon=
      desc: If true the output of value objects will be in SLON format (default is false)
    - name: dsvheader=
      desc: If true will try to output the first line as header (default is true)
    - name: dsvnl=
      desc: Newline sequence to use (default is '\n')
  - name: out=envs
    desc: Tries to output the input data as OS environment variables setting commands
    opts:
    - name: envscmd=
      desc: If defined will output the provided command to set each environment variable (defaults to 'export' or 'set' in Windows)
    - name: envsnocmd=
      desc: If true omits the command before each environment variable assignment, including a custom envscmd (defaults to false)
    - name: envsprefix=
      desc: If defined uses the provided prefix for each environment variable key (defaults to '_OAFP_')
    - name: envsnoprefix=
      desc: Boolean flag to indicate that no envsprefix should be used (defaults to false)
  - name: out=gb64json
    desc: Equivalent to out=base64 and base64gzip=true
  - name: out=grid
    desc: A multiple output ascii grid (useful together with 'loop')
    opts:
    - name: grid=
      desc: A JSON/SLON configuration structured as an array of row arrays. Each row array contains one map per column cell (see column cell options below).
  - name: out=html
    desc: An HTML format
    opts:
    - name: htmlcompact=
      desc: Boolean flag that if true and the input data is a string or markdown the generated html will have a visual compact width format
    - name: htmlpart=
      desc: Boolean flag that if true and the input data is a string or markdown the generated html will be partial and not the complete file
    - name: htmlopen=
      desc: Boolean that if false won't try to open the output contents in a browser (defaults to true). To use outfile= you need to set htmlopen=false.
    - name: htmlwait=
      desc: Amount of ms, when htmlopen=true, to wait for the system browser to open an render the html output
    - name: htmldark=
      desc: If supported and true the output html will use a dark theme.
  - name: out=http
    desc: Sends the output as the body of an HTTP request (POST, PUT, PATCH or DELETE)
    opts:
    - name: httpurl=
      desc: The URL to send the output to (required)
    - name: httpmethod=
      desc: 'The HTTP method: post (default), put, patch or delete'
      opts:
      - name: httpmethod=post
        desc: Sends the output with a POST request
      - name: httpmethod=put
        desc: Sends the output with a PUT request
      - name: httpmethod=patch
        desc: Sends the output with a PATCH request
      - name: httpmethod=delete
        desc: Sends the output with a DELETE request
    - name: httpformat=
      desc: 'The body format: json (default), yaml, ndjson or text. Strings are sent as-is'
      opts:
      - name: httpformat=json
        desc: Sends the output as JSON
      - name: httpformat=yaml
        desc: Sends the output as YAML
      - name: httpformat=ndjson
        desc: Sends the output as newline delimited JSON
      - name: httpformat=text
        desc: Sends the output as plain text
    - name: httpparams=
      desc: A JSON/SLON map of OpenAF $rest options (e.g. requestHeaders, login, pass, timeout, retry)
    - name: httpeach=
      desc: If true and the input is an array, one request is made per entry
    - name: httpquiet=
      desc: If true the server response is not printed
  - name: out=idesc
    desc: Interactive full-screen tree browser for maps, arrays and scalar values; expand/collapse, zoom, filter, queries, previews, bookmarks, comparison and export
    opts:
    - name: idescsource=
      desc: loaded (default) or stream. stream enables file-backed JSON browsing with out=idesc.
    - name: idescrecipe=
      desc: Replay a saved idesc selection/query recipe with the supplied source; use out=idesc to reopen interactively.
    - name: idescpage=
      desc: Entries loaded per expand/"more" step in the tree browser (and per page in the numbered fallback and previews). Default 20.
    - name: idescrecords=
      desc: Batch size for line-oriented input (NDJSON, NDSLON, lines, DSV) or in=json stream=true. Each batch of processed records opens one explorer session; press n (or :next) to drop it and read the next batch, q to stop reading. Only one batch is held in memory. A selection/query is carried over to the next batch when it still applies. Positive integer, default 100. CSV and explicit join options still browse the whole result.
    - name: idescdepth=
      desc: Maximum preview depth. Default 3.
    - name: idescstring=
      desc: Maximum displayed characters per preview string. Default 200. Oversized file-backed scalars may be omitted with a byte-size label.
    - name: idescbytes=
      desc: Maximum selected JSON bytes admitted for file-backed queries/slices. Default 16777216 (16 MiB).
    - name: idescnodes=
      desc: Maximum value nodes admitted for file-backed queries/slices and preview traversal. Default 100000.
  - name: out=ini
    desc: A INI/Properties format (arrays are not supported)
  - name: out=json
    desc: A JSON format without spacing
  - name: out=jsmap
    desc: OpenAF's HTML representation of structured data, printed directly without opening a browser
  - name: out=jwt
    desc: Signs map data into a JSON Web Token (JWT)
    opts:
    - name: jwtsecret=
      desc: A string secret for using HS256, HS384 or HS512 depending on secret size used to sign the JWT.
    - name: jwtprivkey=
      desc: A private key file used to sign (might require specifying the jwtalg).
    - name: jwtalg=
      desc: Specifies the algorithm used to sign the JWT (HS* or RSA by default). Depends on available algorithms on the current JVM.
  - name: out=key
    desc: Stores data into an OpenAF global (used inside OpenAF)
  - name: out=kyaml
    desc: A Kubernetes YAML format
  - name: out=lkyaml
    desc: A Kubernetes YAML format without new-lines
  - name: out=lines
    desc: Given an array of strings prints each line
  - name: out=log
    desc: If input has Logstash compatible fields outputs a human-readable log
    opts:
    - name: logprintall=
      desc: If true all original non data (string) lines will be output
  - name: out=map
    desc: A rectangle map format
  - name: out=md
    desc: A Markdown format
    opts:
    - name: mdtemplate=
      desc: If true will apply a template output without any input data
    - name: mdformat=
      desc: 'For map or array values: structured (default) renders headings, scalar tables, and lists; json or yaml emits the value in a fenced code block.'
  - name: out=mdtable
    desc: A Markdown table format (only for list outputs)
  - name: out=mdyaml
    desc: A multi document YAML format (only for list outputs)
  - name: out=mtree
    desc: A tree-like format without ANSI colors, using Unicode branch characters (falls back to ctree on older OpenAF versions without TREE.mono support)
  - name: out=ndjson
    desc: A NDJSON (new-line delimited JSON) format
  - name: out=ndslon
    desc: A NDSLON (new-line delimited SLON) format
  - name: out=ndcslon
    desc: A NDSLON (new-line delimited SLON) format forcely colored
  - name: out=openmetrics
    desc: Converts a map or list to OpenMetrics/Prometheus compatible format
    opts:
    - name: metricsprefix=
      desc: The prefix to use for each metric (defaults to 'metrics')
    - name: metricstimestamp=
      desc: Unix Epoch in seconds for each metric
  - name: out=oaf
    desc: An OpenAF scripting code or OpenAF scripting file (together with 'outoaf') to execute taking input transformed as 'data'
    opts:
    - name: outoaf=
      desc: OpenAF code or a script file to execute with the transformed input as data
  - name: out=pjson
    desc: A JSON format with spacing (equivalent to prettyjson)
  - name: out=prettyjson
    desc: A JSON format with spacing
  - name: out=pxml
    desc: Tries to output the input data into pretty xml
    opts:
    - name: pxmlprefix=
      desc: A prefix added to all XML tags
  - name: out=raw
    desc: Tries to output the internal representation (string or json) of the input transformed data
  - name: out=rawascii
    desc: Outputs text data line by line with visual representation of non-visual characters
    opts:
    - name: rawasciistart=
      desc: Starting line number to display
    - name: rawasciiend=
      desc: Ending line number to display
    - name: rawasciitab=
      desc: Tab size for tab character visualization (defaults to 8)
    - name: rawasciinovisual=
      desc: If true, non-visual characters won't be replaced by their visual representation
    - name: rawasciinolinenum=
      desc: If true, line numbers won't be displayed
  - name: out=res
    desc: Outputs data to an OpenAF global 'res' (used in oJobs)
  - name: out=schart
    desc: A static line-chart like chart (for a fixed list/array of values)
    opts:
    - name: schart=
      desc: 'Chart definition in the format "<unit> <path:color:legend>... [-min:<n>] [-max:<n>] [-hsize:<n>] [-vsize:<n>]". Unit must be one of: int, dec1, dec2, dec3, dec4, dec, bytes or si. Path is a JMESPath expression equivalent to the path= filter (use quotes for non-basic expressions). The -min and -max flags set the Y-axis range; -hsize and -vsize override the default chart width and height in terminal columns/rows. Unlike out=chart (which accumulates values over time), schart renders a fixed snapshot from the current input array.'
  - name: out=slon
    desc: A SLON format
  - name: out=sql
    desc: Outputs a series of SQL statements for an input list/array data
    opts:
    - name: sqltable=
      desc: The table name to use for the SQL statements (defaults to 'data')
    - name: sqlicase=
      desc: If true the table and fields names won't be double-quoted
    - name: sqlnocreate=
      desc: If true the create table statement won't be generated
  - name: out=stable
    desc: A table-like format with separation (only for list outputs)
  - name: out=table
    desc: A table-like format without size constraints (only for list outputs)
  - name: out=template
    desc: A Handlebars template format
    opts:
    - name: template=
      desc: A file path to a HandleBars' template or a string template definition if 'templatetmpl' is true
    - name: templatepath=
      desc: If 'template' is not provided a path to the template definition (pre-transformation)
    - name: templatedata=
      desc: If defined the template data will be retrieved from the provided path
    - name: templatetmpl=
      desc: If true the 'template' will be interpreted as the template definition instead of a file path
  - name: out=text
    desc: A string text format
  - name: out=toml
    desc: A TOML format (arrays will have outkey=list)
  - name: out=toon
    desc: A TOON format
  - name: out=tree
    desc: A tree-like format
  - name: out=xls
    desc: A XLSx output format
    opts:
    - name: xlsfile=
      desc: The output filename (if not defined a temporary file will be used to open with the OS's Excel-compatible application)
    - name: xlssheet=
      desc: The name of sheet to use (default to 'data')
    - name: xlsformat=
      desc: 'A SLON or JSON string with the formatting of the output file (e.g. (bold: true, borderBottom: "medium", borderBottomColor: "red"))'
    - name: xlsopen=
      desc: If false it won't try to open the OS's Excel-compatible application (defaults to true)
    - name: xlsopenwait=
      desc: The amount of time, in ms, to keep the temporary file for the OS's Excel-compatible application to start and open the file
  - name: out=xml
    desc: An XML format
    opts:
    - name: outxmlprefix=
      desc: A prefix added to all XML tags
  - name: out=yaml
    desc: A YAML format
- name: idescsource=
  desc: loaded (default) or stream. stream enables file-backed JSON browsing with out=idesc.
- name: idescrecipe=
  desc: Replay a saved idesc selection/query recipe with the supplied source; use out=idesc to reopen interactively.
- name: in=
  desc: The input type (if not provided it will try to be auto-detected)
  opts:
  - name: in=ask
    desc: Interactively asks questions to an user (using JSON/SLON for OpenAF's askStruct)
  - name: in=base64
    desc: A base64 text format
    opts:
    - name: base64gzip=
      desc: If true, gzip before Base64 encoding or gunzip after Base64 decoding
  - name: in=ch
    desc: An OpenAF channel format
    opts:
    - name: inch=
      desc: A JSON/SLON configuration string with type and options/url
    - name: inchall=
      desc: A boolean flag to determine if the input map will be used for a getAll query
  - name: in=csv
    desc: A CSV format (auto-detected)
    opts:
    - name: inputcsv=
      desc: CSV input configuration as JSON/SLON
    - name: incsv=
      desc: Alias for inputcsv
    - name: csv=
      desc: If type=csv, the CSV options to use
  - name: in=db
    desc: A JDBC query to a database
    opts:
    - name: indbjdbc=
      desc: The JDBC URL to access the input database
    - name: indbuser=
      desc: The JDBC access user
    - name: indbpass=
      desc: The JDBC access password
    - name: indbtimeout=
      desc: The JDBC access timeout
    - name: indblib=
      desc: Use a JDBC driver oPack generated by ojob.io/db/getDriver
    - name: indbstream=
      desc: If true the output will be processed record by record
    - name: indbexec=
      desc: If true the input SQL is not a query but a DML statement
    - name: indbautocommit=
      desc: If true the input SQL will be executed with autocommit enabled
    - name: indbdesc=
      desc: If true the output will be a list of column names and types (use 'LIMIT 1' for faster results)
  - name: in=dsv
    desc: A DSV (Delimiter Separated Values) format
    opts:
    - name: indsvsep=
      desc: The separator to use (default is ',')
    - name: indsvsepre=
      desc: The regular expression to use as separator
    - name: indsvquote=
      desc: The quote character to use (default is '"')
    - name: indsvescape=
      desc: The escape character to use for double-quotes
    - name: indsvcomment=
      desc: The comment character to use (default is '#')
    - name: indsvheader=
      desc: Uses the first non-comment line as column names (default is true). When false, provide indsvfields.
    - name: indsvtrim=
      desc: Trims header names and values (default is true). Set false to preserve leading and trailing whitespace.
    - name: indsvjoin=
      desc: Returns one array of records when true; otherwise emits each record once (default is false). Applies to stdin, file, cmd and data input.
    - name: indsvfields=
      desc: Comma separated column names. When provided, every non-comment line is data, including the first; no input header is consumed.
  - name: in=gb64json
    desc: Equivalent to in=base64 and base64gzip=true
  - name: in=hsperf
    desc: A Java hsperfdata* file (requires file=hsperfdata_user/123)
    opts:
    - name: hsperfmetadata=
      desc: With in=hsperf, returns {values, header, entries}, including header and per-counter metadata. Defaults to false; requires an updated OpenAF runtime.
  - name: in=httpd
    desc: Receives the input from an HTTP request sent to a temporary local HTTP server (e.g. a webhook)
    opts:
    - name: inhttpdport=
      desc: The port to listen on (if not provided a free port is chosen and reported on stderr)
    - name: inhttpdhost=
      desc: The address to bind to (defaults to 127.0.0.1; use 0.0.0.0 to accept remote connections)
    - name: inhttpdpath=
      desc: If provided only requests to this path (or below) are accepted; others get a 404
    - name: inhttpdtimeout=
      desc: Milliseconds to wait for a request (defaults to 60000; 0 waits forever)
    - name: inhttpdcount=
      desc: Number of requests to process before stopping (defaults to 1; 0 for no limit until a timeout occurs)
    - name: inhttpdtype=
      desc: The input type to parse the request body with (otherwise detected from the Content-Type and the body)
    - name: inhttpdmax=
      desc: Maximum request body size in bytes (defaults to 10485760); larger requests get a 413
    - name: inhttpdstatus=
      desc: The HTTP status code returned to the sender (defaults to 200)
    - name: inhttpdreply=
      desc: The text returned to the sender (defaults to empty)
    - name: inhttpdenvelope=
      desc: If true the input is a map with method, uri, headers, params and body instead of just the parsed body
  - name: in=ini
    desc: INI/Properties format
  - name: in=javas
    desc: Tries to list java processes running locally (javasinception=true to include itself). Adds the hsperf file path when the process id matches ow.java.getLocalJavaPIDs()
    opts:
    - name: javasinception=
      desc: If true includes oafp itself in the local Java process list
  - name: in=javagc
    desc: The Java GC log lines text format
    opts:
    - name: javagcjoin=
      desc: If true returns one array of parsed GC events; otherwise emits events incrementally.
  - name: in=javathread
    desc: The Java Thread stack dump lines text format
    opts:
    - name: javathreadpid=
      desc: Optional you can provider the local java process pid to try to get the thread stack trace (*)
  - name: in=jfr
    desc: The Java Flight Recorder format
    opts:
    - name: jfrjoin=
      desc: If true will join the JFR records to build an output array
    - name: jfrdesc=
      desc: If true it will include a __desc_ entry with the JFR event description
  - name: in=jmx
    desc: Uses Java JMX to retrieve data from another Java process
    opts:
    - name: jmxpid=
      desc: The local java process pid to connect to if 'jmxurl' is not provided.
    - name: jmxurl=
      desc: The JMX URL to connect to if 'jmxpid' is not provided.
    - name: jmxuser=
      desc: The JMX user to use if JMX URL was provided.
    - name: jmxpass=
      desc: The JMX password to use if JMX URL was provided.
    - name: jmxprovider=
      desc: The JMX provider Java class if JMX URL was provided.
    - name: jmxop=
      desc: The operation to perform (see below for options)
  - name: in=json
    desc: A JSON format (auto-detected)
    opts:
    - name: jsondesc=
      desc: If true the output will be a list of JSON paths of the original json. Uses metadata-only scanning when OpenAF provides io.scanJSON, avoiding scalar-value loading; older runtimes and lenient JSON use the compatible reader.
    - name: jsonprefix=
      desc: Given the 'jsondesc=true' output list you can use each to filter big json files by prefix.
  - name: in=jsonschema
    desc: Given a JSON schema format tries to generate sample data for it
  - name: in=jwt
    desc: Decodes and/or verifies a JSON Web Token (JWT)
    opts:
    - name: injwtverify=
      desc: If true the boolean entry '__verified' will be added to the result.
    - name: injwtsecret=
      desc: A string secret for using HS256, HS384 or HS512 depending on secret size used to verify.
    - name: injwtpubkey=
      desc: A public key file used to verify (might require specifying the injwtalg).
    - name: injwtalg=
      desc: Specifies the algorithm used to verify the JWT (HS* or RSA by default). Depends on available algorithms on the current JVM.
    - name: injwtraw=
      desc: If true it won't try to convert Unix epoch timestamps to dates.
  - name: in=lines
    desc: A given string/text to be processed line by line
    opts:
    - name: linesjoin=
      desc: If true it will return an array with each processed line
    - name: linesvisual=
      desc: If true it will try to determine header and column position from spaces and tabs
    - name: linesvisualsepre=
      desc: Regular expression representing the separator between columns when linesvisual=true (defaults to ' \\s+')
    - name: linesvisualheadsep=
      desc: If true will try to process the second line as header separator aiding on column position determination (if linesvisualsepre is not defined it will default to '\\s+')
  - name: in=llm
    desc: A large language model input (uses 'llmenv' or 'llmoptions')
    opts:
    - name: llmenv=
      desc: Environment variable containing the model configuration (defaults to OAFP_MODEL, falling back to OAF_MODEL when absent).
    - name: llmoptions=
      desc: Model configuration as a JSON/SLON string or map; overrides llmenv. See the shared LLM input/transform options below.
    - name: llmconversation=
      desc: JSON file to load an existing conversation from and save the updated conversation to.
    - name: llmimage=
      desc: Image file path or HTTP(S) URL to use with a visual model.
  - name: in=llmdecide
    desc: Stateless decisions over a whole state and named questions using OpenAF $llm().decide()
    opts:
    - name: llmenv=
      desc: Environment variable containing the model configuration (defaults to OAFP_MODEL, falling back to OAF_MODEL when absent).
    - name: llmoptions=
      desc: Model configuration as a JSON/SLON string or map; overrides llmenv. See the shared LLM input/transform options below.
    - name: llmdecidesample=
      desc: Emit a gemini, ollama or openai request sample without input, credentials or inference. Use out=yaml or out=json.
    - name: llmimage=
      desc: Image file path or HTTP(S) URL to use with a visual model.
    - name: llmdecidestats=
      desc: Return {response, stats} from one decideWithStats() execution (defaults to false).
  - name: in=llmmodels
    desc: Lists the large language models available (using 'llmenv' or 'llmoptions')
  - name: in=ls
    desc: Returns a list of files and folders for a given directory path or zip or tar or tgz file
    opts:
    - name: lsext=
      desc: Forces the file format parsing of the provided path or file (between zip, tar, tgz)
    - name: lsrecursive=
      desc: Will list all files and folders recursively (for folders)
    - name: lsposix=
      desc: Tries to add extra posix data if available (for ZIP files)
  - name: in=md
    desc: A Markdown format
  - name: in=mdtable
    desc: A Markdown table format
    opts:
    - name: inmdtablejoin=
      desc: Scans an entire markdown input for tables and returns an array with the data of each markdown table
  - name: in=mdcode
    desc: A Markdown code blocks format
  - name: in=mcp
    desc: A Model Context Protocol (MCP) input
    opts:
    - name: inmcptoolslist=
      desc: If true will list all available MCP tools
    - name: inmcplistprompts=
      desc: If true will list all available MCP prompts
  - name: in=minia
    desc: Executes a mini-a interaction definition (requires the mini-a oPack)
    opts:
    - name: minianolog=
      desc: If true hides mini-a interaction logs and shows a temporary progress message instead
    - name: minialogfile=
      desc: Path to append interaction log lines with timestamps
    - name: miniametrics=
      desc: Path to write the mini-a run metrics as JSON (placeholders can include the run id)
  - name: in=ndjson
    desc: A NDJSON (new-line delimited JSON) format
    opts:
    - name: ndjsonjoin=
      desc: If true will join the ndjson records to build an output array
    - name: ndjsonfilter=
      desc: If true each line is interpreted as an array before filters execute (this allows to filter json records on a ndjson)
  - name: in=ndslon
    desc: A NDSLON (new-line delimited SLON) format
    opts:
    - name: ndslonjoin=
      desc: If true will join the ndslon records to build an output array
    - name: ndslonfilter=
      desc: If true each line is interpreted as an array before filters execute (this allows to filter slon records on a ndslon)
  - name: in=oaf
    desc: Takes an OpenAF scripting code or OpenAF scripting file to execute and use the result as input
  - name: in=oafp
    desc: Takes a JSON/SLON/YAML map input as parameters for calling a sub oafp process (arrays will call multiple oafp processes; inoafpseq=true will process sequentially)
    opts:
    - name: inoafpseq=
      desc: If true processes an input array of oafp parameter maps sequentially
  - name: in=ojob
    desc: Takes a JSON/SLON/YAML map input with a 'ojob' string and a 'args' map parameter
  - name: in=openmetrics
    desc: An OpenMetrics/Prometheus compatible format
  - name: in=raw
    desc: Passes the input directly to transforms and output
  - name: in=rawhex
    desc: Tries to read the input char by char converting into lines with the hexadecimal representation
    opts:
    - name: inrawhexline=
      desc: Number of hexadecimal characters per returned array line
  - name: in=sh
    desc: Executes a shell command returning stdout, stderr and exitcode as a map
    opts:
    - name: inshformat=
      desc: The format to parse stdout and stderr between raw, yaml or json (default)
  - name: in=slon
    desc: A SLON format (auto-detected)
  - name: in=snmp
    desc: A SNMP device source
    opts:
    - name: insnmp=
      desc: A SNMP address in the form 'udp://1.2.3.4/161'
    - name: insnmpcommunity=
      desc: The SNMP community to use (default 'public')
    - name: insnmptimeout=
      desc: The timeout to wait for a reply
    - name: insnmpretries=
      desc: Number of retries in case of failure
    - name: insnmpversion=
      desc: Version of the SNMP server (e.g. 2, 3)
    - name: insnmpsec=
      desc: A JSON/SLON representation of security attributes (see below)
  - name: in=sql
    desc: One or more SQLs statements to AST (Abstract Syntax Tree) or beautified SQL
    opts:
    - name: sqlparse=
      desc: If true instead of returning a SQL AST representation it will beautify the SQL statement(s)
    - name: sqloptions=
      desc: A JSON/SLON map with options for sqlparse=true
  - name: in=toml
    desc: TOML format
  - name: in=toon
    desc: TOON format
  - name: in=xls
    desc: A XLSx compatible file (requires file=abc.xlsx)
    opts:
    - name: inxlssheet=
      desc: The name of sheet to consider (default to the first sheet)
    - name: inxlsevalformulas=
      desc: If false the existing formulas won't be evaluated (defaults to true)
    - name: inxlsdesc=
      desc: If true, instead of retrieving data, either a list of sheet names will be returned, or, if inxlssheet is provided, a table with '___' of empty cells and '###' for non-empty cells will be returned
    - name: inxlscol=
      desc: The column on the sheet where a table should be detected (e.g. "A")
    - name: inxlsrow=
      desc: The row on the sheet where a table should be detected (e.g. 1)
  - name: in=xml
    desc: An XML format (auto-detected)
    opts:
    - name: xmlignored=
      desc: A comma-separated list of XML tags to ignore
    - name: xmlprefix=
      desc: A prefix to add to all XML tags
    - name: xmlfiltertag=
      desc: If true will filter the XML tags
  - name: in=yaml
    desc: A YAML format (auto-detected)
- name: ifrom=
  desc: An OpenAF nLinq expression to filter input data
- name: isql=
  desc: A SQL expression to filter input data
- name: from=
  desc: An OpenAF nLinq path expression to filter output
- name: sql=
  desc: A SQL expression to filter output
- name: ijq=
  desc: A jq expression to filter input after path and before transforms; requires OpenAF $jq
- name: jq=
  desc: Alias for ijq; do not combine with ijq
- name: ojq=
  desc: A jq expression to filter output after opath
- name: opath=
  desc: A JMESPath expression to filter output data
- name: sqlfilter=
  desc: 'Enables the forcing of the sql filter parser (values: auto, simple, advanced)'
- name: sqlfiltertables=
  desc: A JSON/SLON array composed of 'table' name and 'path' to each table's data to be used with the sqlfilter
- name: path=
  desc: A JMESPath expression to filter input before transforms
- name: csv=
  desc: If type=csv, the CSV options to use
- name: outkey=
  desc: If defined the map/list output will be prefixed with the provided key
- name: outfile=
  desc: If defined all output will be written to the provided file
- name: outfileappend=
  desc: If 'true' and outfile=true the output will be appended on the provided file
- name: parallel=
  desc: auto (default), true, or false. Auto measures eligible pure work before using bounded workers. Record output stays ordered; explicit true also enables supported specialized parallel operations. false overrides OAFP_PARALLEL.
- name: progress=
  desc: auto (default) or off. Shows a delayed wait animation on interactive stderr only.
- name: stream=
  desc: With in=json, processes a top-level array one element at a time using record-level filters and output. Default false.
- name: pause=
  desc: If 'true' (or -p) will try to pause contents in alternative to _less -r_. PgUp/Left and PgDown/Right move by a page; Up/Down move by a line. Shift+Left/Home goes to the top; Shift+Right/End goes to the bottom. Shift+PgUp/PgDown are also supported as top/bottom aliases. At the bottom, navigation remains available; forward paging or an ordinary key exits. Use q to quit. These controls require an updated OpenAF runtime.
- name: color=
  desc: If 'true' will force colored output if available
- name: url=
  desc: Retrieves data from the provided URL
- name: urlmethod=
  desc: If 'url' is provided defines the http method to use if different from GET
- name: urlparams=
  desc: If 'url' is provided extra parameters (equivalent to OpenAF's $rest) can be provided in JSON/SLON
- name: urldata=
  desc: If 'url' is provided a JSON/SLON/text data can be provided
- name: insecure=
  desc: If true will ignore SSL/TLS certificate validation
- name: chs=
  desc: A JSON/SLON map or array composed of an OpenAF channel 'name', 'type' and optional 'options'
- name: loop=
  desc: If defined will loop the processing by the number of seconds provided
- name: loopcls=
  desc: If 'true' and loop is defined it will clear the screen (or file) on each loop cycle
- name: libs=
  desc: Comma delimited list of installed OpenAF's oPacks to consider to extend oafp's inputs, transformations and outputs
- name: pipe=
  desc: A JSON/SLON/YAML map for recursive call of oafp similar to using unix pipes (useful with -f)
- name: '-f'
  desc: Enables to provide a JSON/SLON/YAML file with all the oafp parameters as a map
- name: '-examples'
  desc: Will access an internet based list of oafp examples and list them
- name: examples=
  desc: Will search the provided keyword or 'category::subcategory' in the internet based list of oafp examples
- name: version=
  desc: Alternative way to change the input to a map with the tool's version
- name: '-v'
  desc: Changes the input to a map with the tool's version info
- name: debug=
  desc: If true prints debugging messages
- name: arraytomap=
  desc: If true will try to convert the input array to a map (see arraytomapkey, arraytomapkeepkey)
- name: arraytomapkeepkey=
  desc: If true and arraytomap=true the defined arraytomapkey won't be removed from each map
- name: arraytomapkey=
  desc: For arraytomap=true defines the name of the map property that will be each element key (see arraytomapkeepkey)
- name: allstrings=
  desc: If true will try to convert all values to strings
- name: cmlt=
  desc: If true will accumulate the input values into an output array (useful with loop)
  opts:
  - name: cmltch=
    desc: A JSON/SLON OpenAF channel configuration string with type and options/url (defaults to simple)
  - name: cmltsize=
    desc: The number of input data values to keep (default 100). If -1 it will keep without a limit
- name: correcttypes=
  desc: If true will try to convert alpha-numeric field values with just numbers to number fields, string date fields to dates and boolean fields
- name: denormalize=
  desc: Reverses 'normalize' given a JSON/SLON map with a normalize schema (see OpenAF's ow.ai.normalize.withSchema)
- name: diff=
  desc: A JSON/SLON map with a 'a' path and a 'b' path to compare and provide diff data
  opts:
  - name: difftheme=
    desc: A JSON/SLON map with the colors to use if color = true
  - name: diffnlines=
    desc: If true will append each line with a line number of the final result of the differences between 'a' and 'b' (just for rough reference)
  - name: diffwords=
    desc: If true and the input is text based will perform the diff at the word level
  - name: diffwordswithspace=
    desc: If true and the input is text based will perform the diff at the word + spaces level
  - name: difflines=
    desc: If true and the input is text based will perform the diff at the lines level
  - name: diffsentences=
    desc: If true and the input is text based will perform the diff at the sentence level
  - name: diffchars=
    desc: If true and the input is text based will perform the diff at the char level
- name: mapdiff=
  desc: A JSON/SLON map with 'a' and 'b' paths selecting maps to compare structurally. Returns onlyA, onlyB and changed maps. See Map diff.
- name: field2byte=
  desc: A comma delimited list of fields whose value should be converted to a byte abbreviation
- name: field2date=
  desc: A comma delimited list of fields whose value should be converted to date values
- name: field2si=
  desc: A comma delimited list of fields whose value should be converted to a SI abbreviation
- name: field2str=
  desc: A comma delimited list of fields whose value should be converted to a string representation
- name: field4map=
  desc: A comma delimited list of fields whose value should be converted from JSON/SLON string representation to a map
- name: flatmap=
  desc: If true a map structure will be flat to just one level (optionally flatmapsep=[char] to use a different separator that '.')
- name: getlist=
  desc: If true, selects the first nested array; a positive number selects the nth nested array in traversal order. If disabled or no matching array is found, preserves the input, including scalar values.
- name: forcearray=
  desc: If true and if the input is a map it will force it to be an array with that map as the only element
- name: jsonschema=
  desc: The JSON schema file to use for validation returning a map with a boolean valid and errors if exist
- name: jsonschemacmd=
  desc: Alternative option to 'jsonschema' to retrieve the JSON schema data to use for validation returning a map with a boolean valid and errors if exist
- name: jsonschemaoptions=
  desc: JSON/SLON Ajv options for jsonschema or jsonschemacmd, merged with allErrors=true; see JSON Schema
- name: jsonschemagen=
  desc: If true will taken the provided input map as an example to generate an output json schema
- name: kmeans=
  desc: Given an array of 'normalized' data will cluster data into the number of centroids provided
- name: llmcontext=
  desc: If 'llmprompt' is defined provides extra context to the model regarding the input data
- name: llmdecide=
  desc: Per-entry stateless decisions; inline JSON/SLON configuration or JSON/YAML/SLON file. See Decision enrichment.
  opts:
  - name: llmenv=
    desc: Environment variable containing the model configuration (defaults to OAFP_MODEL, falling back to OAF_MODEL when absent).
  - name: llmoptions=
    desc: Model configuration as a JSON/SLON string or map; overrides llmenv. See the shared LLM input/transform options below.
  - name: llmconversation=
    desc: JSON file to load an existing conversation from and save the updated conversation to.
  - name: llmimage=
    desc: Image file path or HTTP(S) URL to use with a visual model.
- name: llmprompt=
  desc: A large language model prompt to transform the input data to json (uses the same input options 'llmenv' and 'llmoptions')
  opts:
  - name: llmenv=
    desc: Environment variable containing the model configuration (defaults to OAFP_MODEL, falling back to OAF_MODEL when absent).
  - name: llmoptions=
    desc: Model configuration as a JSON/SLON string or map; overrides llmenv. See the shared LLM input/transform options below.
  - name: llmconversation=
    desc: JSON file to load an existing conversation from and save the updated conversation to.
  - name: llmimage=
    desc: Image file path or HTTP(S) URL to use with a visual model.
- name: maptoarray=
  desc: If true will try to convert the input map to an array (see maptoarraykey)
- name: maptoarraykey=
  desc: If maptoarray=true defines the name of the map property that will hold the key for each map in the new array
- name: merge=
  desc: If input is a list/array of maps will merge each element into one map
- name: normalize=
  desc: A JSON/SLON map with a normalize schema (see OpenAF's ow.ai.normalize.withSchema)
- name: numformat=
  desc: For all number values applies a java.util.Formatter format (e.g. %,d)
- name: oaf=
  desc: An OpenAF scripting code or OpenAF scripting file to execute taking input as 'data' and returning the transformed data
- name: regression=
  desc: Performs a regression (linear, log, exp, poly or power) over a provided list/array of numeric values
  opts:
  - name: regressionpath=
    desc: The path to the array of y values for the regression formulas
  - name: regressionx=
    desc: Optional path to the array of x values for the regression formulas (defaults to 1, 2, 3, ...)
  - name: regressionoptions=
    desc: A JSON/SLON configuration with order (defaults to 2) and/or precision (defaults to 5)
  - name: regressionforecast=
    desc: Optional path to an array of x values for which to forecast the corresponding y
- name: removedups=
  desc: Removes duplicate array entries, retaining the first occurrence. Map key order is ignored recursively; array order and the distinction between arrays and maps are preserved.
- name: removeempty=
  desc: If true will remove array/list entries that are either null or undefined
- name: removenulls=
  desc: If true will try to remove nulls and undefined values from a map or array
- name: searchkeys=
  desc: Will return a map with only keys that match the provided string
- name: searchvalues=
  desc: Will return am map with only values that match the provided string
- name: set=
  desc: Performs set operations (intersection by default) over an 'a' and 'b' path to an array defined in a JSON/SLON map. Comparisons ignore map key order recursively while preserving array order and distinguishing arrays from maps.
  opts:
  - name: setop=
    desc: Allows to choose a different set operation between 'union', 'diffa', 'diffb', 'diffab' (symmetric difference), 'diff' and 'intersect' (default)
    opts:
    - name: setop=union
      desc: Will return the union of the two sets
    - name: setop=diffa
      desc: Will return the difference between 'a' and 'b'
    - name: setop=diffb
      desc: Will return the difference between 'b' and 'a'
    - name: setop=diffab
      desc: Will return the symmetric difference between 'a' and 'b'
    - name: setop=diff
      desc: Will identify which set contains each entry
    - name: setop=intersect
      desc: Will return the intersection of the two sets
- name: sortmapkeys=
  desc: Recursively sorts map keys, including maps inside arrays. Preserves arrays, their element order, and scalar values.
- name: spacekeys=
  desc: Replaces spaces in keys with the provided string (for example, helpful for XML output)
- name: trim=
  desc: If true all the strings of the result map/list will be trimmed
- name: val2icon=
  desc: If defined will transform undefined, null and boolean values to emoticons (values can be 'default' or 'simple')
- name: xjs=
  desc: A .js file with function code manipulating an input 'args'. Returns the transformed 'args' variable.
- name: xpy=
  desc: A .py file with Python function code manipulating an input 'args'. Returns the transformed 'args' variable.
- name: xfn=
  desc: A javascript code, receiving input as 'args' and return it's code evaluation.
- name: xrjs=
  desc: A .js file with function code to manipulate each input array record as 'args'. Returns the transformed 'args' record.
- name: xrpy=
  desc: A .py file with function code to manipulate each input array record as 'args'. Returns the transformed 'args' record.
- name: xrfn=
  desc: A javascript code, receiving each input array record as 'args' and return it's code evaluation.
- name: inch=
  desc: A JSON/SLON configuration string with type and options/url
- name: inchall=
  desc: A boolean flag to determine if the input map will be used for a getAll query
- name: indbjdbc=
  desc: The JDBC URL to access the input database
- name: indbuser=
  desc: The JDBC access user
- name: indbpass=
  desc: The JDBC access password
- name: indbtimeout=
  desc: The JDBC access timeout
- name: indblib=
  desc: Use a JDBC driver oPack generated by ojob.io/db/getDriver
- name: indbstream=
  desc: If true the output will be processed record by record
- name: indbexec=
  desc: If true the input SQL is not a query but a DML statement
- name: indbautocommit=
  desc: If true the input SQL will be executed with autocommit enabled
- name: indbdesc=
  desc: If true the output will be a list of column names and types (use 'LIMIT 1' for faster results)
- name: indsvsep=
  desc: The separator to use (default is ',')
- name: indsvsepre=
  desc: The regular expression to use as separator
- name: indsvquote=
  desc: The quote character to use (default is '"')
- name: indsvescape=
  desc: The escape character to use for double-quotes
- name: indsvcomment=
  desc: The comment character to use (default is '#')
- name: indsvheader=
  desc: Uses the first non-comment line as column names (default is true). When false, provide indsvfields.
- name: indsvtrim=
  desc: Trims header names and values (default is true). Set false to preserve leading and trailing whitespace.
- name: indsvjoin=
  desc: Returns one array of records when true; otherwise emits each record once (default is false). Applies to stdin, file, cmd and data input.
- name: indsvfields=
  desc: Comma separated column names. When provided, every non-comment line is data, including the first; no input header is consumed.
- name: javagcjoin=
  desc: If true returns one array of parsed GC events; otherwise emits events incrementally.
- name: javathreadpid=
  desc: Optional you can provider the local java process pid to try to get the thread stack trace (*)
- name: hsperfmetadata=
  desc: With in=hsperf, returns {values, header, entries}, including header and per-counter metadata. Defaults to false; requires an updated OpenAF runtime.
- name: inhttpdport=
  desc: The port to listen on (if not provided a free port is chosen and reported on stderr)
- name: inhttpdhost=
  desc: The address to bind to (defaults to 127.0.0.1; use 0.0.0.0 to accept remote connections)
- name: inhttpdpath=
  desc: If provided only requests to this path (or below) are accepted; others get a 404
- name: inhttpdtimeout=
  desc: Milliseconds to wait for a request (defaults to 60000; 0 waits forever)
- name: inhttpdcount=
  desc: Number of requests to process before stopping (defaults to 1; 0 for no limit until a timeout occurs)
- name: inhttpdtype=
  desc: The input type to parse the request body with (otherwise detected from the Content-Type and the body)
- name: inhttpdmax=
  desc: Maximum request body size in bytes (defaults to 10485760); larger requests get a 413
- name: inhttpdstatus=
  desc: The HTTP status code returned to the sender (defaults to 200)
- name: inhttpdreply=
  desc: The text returned to the sender (defaults to empty)
- name: inhttpdenvelope=
  desc: If true the input is a map with method, uri, headers, params and body instead of just the parsed body
- name: javasinception=
  desc: If true includes oafp itself in the local Java process list
- name: jfrjoin=
  desc: If true will join the JFR records to build an output array
- name: jfrdesc=
  desc: If true it will include a __desc_ entry with the JFR event description
- name: jmxpid=
  desc: The local java process pid to connect to if 'jmxurl' is not provided.
- name: jmxurl=
  desc: The JMX URL to connect to if 'jmxpid' is not provided.
- name: jmxuser=
  desc: The JMX user to use if JMX URL was provided.
- name: jmxpass=
  desc: The JMX password to use if JMX URL was provided.
- name: jmxprovider=
  desc: The JMX provider Java class if JMX URL was provided.
- name: jmxop=
  desc: The operation to perform (see below for options)
- name: jsondesc=
  desc: If true the output will be a list of JSON paths of the original json. Uses metadata-only scanning when OpenAF provides io.scanJSON, avoiding scalar-value loading; older runtimes and lenient JSON use the compatible reader.
- name: jsonprefix=
  desc: Given the 'jsondesc=true' output list you can use each to filter big json files by prefix.
- name: injwtverify=
  desc: If true the boolean entry '__verified' will be added to the result.
- name: injwtsecret=
  desc: A string secret for using HS256, HS384 or HS512 depending on secret size used to verify.
- name: injwtpubkey=
  desc: A public key file used to verify (might require specifying the injwtalg).
- name: injwtalg=
  desc: Specifies the algorithm used to verify the JWT (HS* or RSA by default). Depends on available algorithms on the current JVM.
- name: injwtraw=
  desc: If true it won't try to convert Unix epoch timestamps to dates.
- name: linesjoin=
  desc: If true it will return an array with each processed line
- name: linesvisual=
  desc: If true it will try to determine header and column position from spaces and tabs
- name: linesvisualsepre=
  desc: Regular expression representing the separator between columns when linesvisual=true (defaults to ' \\s+')
- name: linesvisualheadsep=
  desc: If true will try to process the second line as header separator aiding on column position determination (if linesvisualsepre is not defined it will default to '\\s+')
- name: llmenv=
  desc: Environment variable containing the model configuration (defaults to OAFP_MODEL, falling back to OAF_MODEL when absent).
- name: llmoptions=
  desc: Model configuration as a JSON/SLON string or map; overrides llmenv. See the shared LLM input/transform options below.
- name: llmconversation=
  desc: JSON file to load an existing conversation from and save the updated conversation to.
- name: llmimage=
  desc: Image file path or HTTP(S) URL to use with a visual model.
- name: llmdecidesample=
  desc: Emit a gemini, ollama or openai request sample without input, credentials or inference. Use out=yaml or out=json.
- name: llmdecidestats=
  desc: Return {response, stats} from one decideWithStats() execution (defaults to false).
- name: lsext=
  desc: Forces the file format parsing of the provided path or file (between zip, tar, tgz)
- name: lsrecursive=
  desc: Will list all files and folders recursively (for folders)
- name: lsposix=
  desc: Tries to add extra posix data if available (for ZIP files)
- name: inmdtablejoin=
  desc: Scans an entire markdown input for tables and returns an array with the data of each markdown table
- name: inmcptoolslist=
  desc: If true will list all available MCP tools
- name: inmcplistprompts=
  desc: If true will list all available MCP prompts
- name: minianolog=
  desc: If true hides mini-a interaction logs and shows a temporary progress message instead
- name: minialogfile=
  desc: Path to append interaction log lines with timestamps
- name: miniametrics=
  desc: Path to write the mini-a run metrics as JSON (placeholders can include the run id)
- name: ndjsonjoin=
  desc: If true will join the ndjson records to build an output array
- name: ndjsonfilter=
  desc: If true each line is interpreted as an array before filters execute (this allows to filter json records on a ndjson)
- name: ndslonjoin=
  desc: If true will join the ndslon records to build an output array
- name: ndslonfilter=
  desc: If true each line is interpreted as an array before filters execute (this allows to filter slon records on a ndslon)
- name: inoafpseq=
  desc: If true processes an input array of oafp parameter maps sequentially
- name: inrawhexline=
  desc: Number of hexadecimal characters per returned array line
- name: inshformat=
  desc: The format to parse stdout and stderr between raw, yaml or json (default)
- name: insnmp=
  desc: A SNMP address in the form 'udp://1.2.3.4/161'
- name: insnmpcommunity=
  desc: The SNMP community to use (default 'public')
- name: insnmptimeout=
  desc: The timeout to wait for a reply
- name: insnmpretries=
  desc: Number of retries in case of failure
- name: insnmpversion=
  desc: Version of the SNMP server (e.g. 2, 3)
- name: insnmpsec=
  desc: A JSON/SLON representation of security attributes (see below)
- name: sqlparse=
  desc: If true instead of returning a SQL AST representation it will beautify the SQL statement(s)
- name: sqloptions=
  desc: A JSON/SLON map with options for sqlparse=true
- name: inxlssheet=
  desc: The name of sheet to consider (default to the first sheet)
- name: inxlsevalformulas=
  desc: If false the existing formulas won't be evaluated (defaults to true)
- name: inxlsdesc=
  desc: If true, instead of retrieving data, either a list of sheet names will be returned, or, if inxlssheet is provided, a table with '___' of empty cells and '###' for non-empty cells will be returned
- name: inxlscol=
  desc: The column on the sheet where a table should be detected (e.g. "A")
- name: inxlsrow=
  desc: The row on the sheet where a table should be detected (e.g. 1)
- name: xmlignored=
  desc: A comma-separated list of XML tags to ignore
- name: xmlprefix=
  desc: A prefix to add to all XML tags
- name: xmlfiltertag=
  desc: If true will filter the XML tags
- name: base64gzip=
  desc: If true, gzip before Base64 encoding or gunzip after Base64 decoding
- name: inputcsv=
  desc: CSV input configuration as JSON/SLON
- name: incsv=
  desc: Alias for inputcsv
- name: cmltch=
  desc: A JSON/SLON OpenAF channel configuration string with type and options/url (defaults to simple)
- name: cmltsize=
  desc: The number of input data values to keep (default 100). If -1 it will keep without a limit
- name: difftheme=
  desc: A JSON/SLON map with the colors to use if color = true
- name: diffnlines=
  desc: If true will append each line with a line number of the final result of the differences between 'a' and 'b' (just for rough reference)
- name: diffwords=
  desc: If true and the input is text based will perform the diff at the word level
- name: diffwordswithspace=
  desc: If true and the input is text based will perform the diff at the word + spaces level
- name: difflines=
  desc: If true and the input is text based will perform the diff at the lines level
- name: diffsentences=
  desc: If true and the input is text based will perform the diff at the sentence level
- name: diffchars=
  desc: If true and the input is text based will perform the diff at the char level
- name: regressionpath=
  desc: The path to the array of y values for the regression formulas
- name: regressionx=
  desc: Optional path to the array of x values for the regression formulas (defaults to 1, 2, 3, ...)
- name: regressionoptions=
  desc: A JSON/SLON configuration with order (defaults to 2) and/or precision (defaults to 5)
- name: regressionforecast=
  desc: Optional path to an array of x values for which to forecast the corresponding y
- name: setop=
  desc: Allows to choose a different set operation between 'union', 'diffa', 'diffb', 'diffab' (symmetric difference), 'diff' and 'intersect' (default)
  opts:
  - name: setop=union
    desc: Will return the union of the two sets
  - name: setop=diffa
    desc: Will return the difference between 'a' and 'b'
  - name: setop=diffb
    desc: Will return the difference between 'b' and 'a'
  - name: setop=diffab
    desc: Will return the symmetric difference between 'a' and 'b'
  - name: setop=diff
    desc: Will identify which set contains each entry
  - name: setop=intersect
    desc: Will return the intersection of the two sets
- name: idescpage=
  desc: Entries loaded per expand/"more" step in the tree browser (and per page in the numbered fallback and previews). Default 20.
- name: idescrecords=
  desc: Batch size for line-oriented input (NDJSON, NDSLON, lines, DSV) or in=json stream=true. Each batch of processed records opens one explorer session; press n (or :next) to drop it and read the next batch, q to stop reading. Only one batch is held in memory. A selection/query is carried over to the next batch when it still applies. Positive integer, default 100. CSV and explicit join options still browse the whole result.
- name: idescdepth=
  desc: Maximum preview depth. Default 3.
- name: idescstring=
  desc: Maximum displayed characters per preview string. Default 200. Oversized file-backed scalars may be omitted with a byte-size label.
- name: idescbytes=
  desc: Maximum selected JSON bytes admitted for file-backed queries/slices. Default 16777216 (16 MiB).
- name: idescnodes=
  desc: Maximum value nodes admitted for file-backed queries/slices and preview traversal. Default 100000.
- name: ch=
  desc: A JSON/SLON configuration string with type and options/url
- name: chkey=
  desc: A comma delimited list of map keys to build a key from each array value
- name: chunset=
  desc: If true the input data will be used to unset data on the output channel instead of set
- name: chart=
  desc: Required. Unit, one or more series, and optional axis/size flags, as described below.
- name: chartcls=
  desc: Clear the screen before printing each chart update. Use this or the general loopcls=true option to redraw in place. Otherwise updates are printed one after another.
- name: outcmd=
  desc: The command to execute receiving, in pipeline, each input entry in json
- name: outcmdjoin=
  desc: If true and if input is an array the entire array will be the input entry
- name: outcmdseq=
  desc: If true and if input is an array the commands will be executed in sequence
- name: outcmdnl=
  desc: If true each command execution output will be appended with a new-line
- name: outcmdparam=
  desc: If true the input entry will be replaced on the 'outcmd' where '{}' is found
- name: outcmdtmpl=
  desc: If true the input entry will be considered as an HandleBars' template
- name: dbjdbc=
  desc: The JDBC URL to access the input database
- name: dbuser=
  desc: The JDBC access user
- name: dbpass=
  desc: The JDBC access password
- name: dbtimeout=
  desc: The JDBC access timeout
- name: dblib=
  desc: Use a JDBC driver oPack generated by ojob.io/db/getDriver
- name: dbtable=
  desc: The db table in which should be inserted ('data' by default)
- name: dbnocreate=
  desc: If true no table creation command will be executed (if the table already exists set this to true)
- name: dbicase=
  desc: If true table and field names will try to ignore case
- name: dbbatchsize=
  desc: If defined it will changed the default batch data insert process
- name: dsvsep=
  desc: The separator to use (default is ',')
- name: dsvquote=
  desc: Replacement for double quotes inside serialized object/array cells (default is a backslash followed by a double quote). String cells and headers always use double quotes, with embedded quotes doubled.
- name: dsvfields=
  desc: Comma separated output columns in the requested order. Defaults to the first row's keys for the whole table. Missing values are empty; additional keys in later rows are omitted. Does not override dsvheader=false.
- name: dsvuseslon=
  desc: If true the output of value objects will be in SLON format (default is false)
- name: dsvheader=
  desc: If true will try to output the first line as header (default is true)
- name: dsvnl=
  desc: Newline sequence to use (default is '\n')
- name: envscmd=
  desc: If defined will output the provided command to set each environment variable (defaults to 'export' or 'set' in Windows)
- name: envsnocmd=
  desc: If true omits the command before each environment variable assignment, including a custom envscmd (defaults to false)
- name: envsprefix=
  desc: If defined uses the provided prefix for each environment variable key (defaults to '_OAFP_')
- name: envsnoprefix=
  desc: Boolean flag to indicate that no envsprefix should be used (defaults to false)
- name: jwtsecret=
  desc: A string secret for using HS256, HS384 or HS512 depending on secret size used to sign the JWT.
- name: jwtprivkey=
  desc: A private key file used to sign (might require specifying the jwtalg).
- name: jwtalg=
  desc: Specifies the algorithm used to sign the JWT (HS* or RSA by default). Depends on available algorithms on the current JVM.
- name: grid=
  desc: A JSON/SLON configuration structured as an array of row arrays. Each row array contains one map per column cell (see column cell options below).
- name: httpurl=
  desc: The URL to send the output to (required)
- name: httpmethod=
  desc: 'The HTTP method: post (default), put, patch or delete'
  opts:
  - name: httpmethod=post
    desc: Sends the output with a POST request
  - name: httpmethod=put
    desc: Sends the output with a PUT request
  - name: httpmethod=patch
    desc: Sends the output with a PATCH request
  - name: httpmethod=delete
    desc: Sends the output with a DELETE request
- name: httpformat=
  desc: 'The body format: json (default), yaml, ndjson or text. Strings are sent as-is'
  opts:
  - name: httpformat=json
    desc: Sends the output as JSON
  - name: httpformat=yaml
    desc: Sends the output as YAML
  - name: httpformat=ndjson
    desc: Sends the output as newline delimited JSON
  - name: httpformat=text
    desc: Sends the output as plain text
- name: httpparams=
  desc: A JSON/SLON map of OpenAF $rest options (e.g. requestHeaders, login, pass, timeout, retry)
- name: httpeach=
  desc: If true and the input is an array, one request is made per entry
- name: httpquiet=
  desc: If true the server response is not printed
- name: htmlcompact=
  desc: Boolean flag that if true and the input data is a string or markdown the generated html will have a visual compact width format
- name: htmlpart=
  desc: Boolean flag that if true and the input data is a string or markdown the generated html will be partial and not the complete file
- name: htmlopen=
  desc: Boolean that if false won't try to open the output contents in a browser (defaults to true). To use outfile= you need to set htmlopen=false.
- name: htmlwait=
  desc: Amount of ms, when htmlopen=true, to wait for the system browser to open an render the html output
- name: htmldark=
  desc: If supported and true the output html will use a dark theme.
- name: logprintall=
  desc: If true all original non data (string) lines will be output
- name: mdtemplate=
  desc: If true will apply a template output without any input data
- name: mdformat=
  desc: 'For map or array values: structured (default) renders headings, scalar tables, and lists; json or yaml emits the value in a fenced code block.'
- name: outoaf=
  desc: OpenAF code or a script file to execute with the transformed input as data
- name: pxmlprefix=
  desc: A prefix added to all XML tags
- name: rawasciistart=
  desc: Starting line number to display
- name: rawasciiend=
  desc: Ending line number to display
- name: rawasciitab=
  desc: Tab size for tab character visualization (defaults to 8)
- name: rawasciinovisual=
  desc: If true, non-visual characters won't be replaced by their visual representation
- name: rawasciinolinenum=
  desc: If true, line numbers won't be displayed
- name: metricsprefix=
  desc: The prefix to use for each metric (defaults to 'metrics')
- name: metricstimestamp=
  desc: Unix Epoch in seconds for each metric
- name: schart=
  desc: 'Chart definition in the format "<unit> <path:color:legend>... [-min:<n>] [-max:<n>] [-hsize:<n>] [-vsize:<n>]". Unit must be one of: int, dec1, dec2, dec3, dec4, dec, bytes or si. Path is a JMESPath expression equivalent to the path= filter (use quotes for non-basic expressions). The -min and -max flags set the Y-axis range; -hsize and -vsize override the default chart width and height in terminal columns/rows. Unlike out=chart (which accumulates values over time), schart renders a fixed snapshot from the current input array.'
- name: sqltable=
  desc: The table name to use for the SQL statements (defaults to 'data')
- name: sqlicase=
  desc: If true the table and fields names won't be double-quoted
- name: sqlnocreate=
  desc: If true the create table statement won't be generated
- name: template=
  desc: A file path to a HandleBars' template or a string template definition if 'templatetmpl' is true
- name: templatepath=
  desc: If 'template' is not provided a path to the template definition (pre-transformation)
- name: templatedata=
  desc: If defined the template data will be retrieved from the provided path
- name: templatetmpl=
  desc: If true the 'template' will be interpreted as the template definition instead of a file path
- name: xlsfile=
  desc: The output filename (if not defined a temporary file will be used to open with the OS's Excel-compatible application)
- name: xlssheet=
  desc: The name of sheet to use (default to 'data')
- name: xlsformat=
  desc: 'A SLON or JSON string with the formatting of the output file (e.g. (bold: true, borderBottom: "medium", borderBottomColor: "red"))'
- name: xlsopen=
  desc: If false it won't try to open the OS's Excel-compatible application (defaults to true)
- name: xlsopenwait=
  desc: The amount of time, in ms, to keep the temporary file for the OS's Excel-compatible application to start and open the file
- name: outxmlprefix=
  desc: A prefix added to all XML tags
- name: secRepo=
  desc: sBucket repository
- name: secBucket=
  desc: sBucket bucket name
- name: secPass=
  desc: sBucket bucket password
- name: secMainPass=
  desc: sBucket repository password
- name: secFile=
  desc: Optional sBucket file source
- name: secEnv=
  desc: A boolean flag to use environment variables as sBuckets
- name: secKey=
  desc: The mandatory sBucket bucket key to use
  opts:
  - name: secRepo=
    desc: sBucket repository
  - name: secBucket=
    desc: sBucket bucket name
  - name: secPass=
    desc: sBucket bucket password
  - name: secMainPass=
    desc: sBucket repository password
  - name: secFile=
    desc: Optional sBucket file source
  - name: secEnv=
    desc: A boolean flag to use environment variables as sBuckets
