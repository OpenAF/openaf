- name: ingzip=
  desc: Decompress file input with OpenAF gzip streams. Auto-detected from .gz (case-insensitive); true forces decompression and false disables it. The preceding extension selects the input format.
- name: cmd=
  desc: Alternative to file and stdin to execute a command (e.g. kubectl, docker) to get the file contents
- name: data=
  desc: Alternative to file, stdin and cmd to provide data input
- name: out=
  desc: 'The output format (default: ctree)'
  opts:
